[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "makutu"
version = "0.1.0"
description = "Seismic modelling, imaging and full-waveform inversion on the FUnTiDES solvers (pyfuntides)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CeCILL-C"}
# pyfuntides and kokkos are not pip packages: they come from the FUnTiDES
# installation (source <install>/funtides_env.sh before using makutu).
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "mpi4py",
    "h5py",
    "segyio",
    "vtk",
    "pyevtk",
    "numba",
]

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["makutu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
